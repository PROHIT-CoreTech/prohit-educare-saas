services:
  - type: web
    name: prohit-educare-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_PREFIX
        value: api
      - key: APP_DOMAIN
        value: educare.prohitcoretech.com
