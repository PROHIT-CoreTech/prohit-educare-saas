<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Light Educational Mesh Ambient Gradients -->
    <linearGradient id="eduMeshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#ecfeff" opacity="0.9" />
      <stop offset="100%" stop-color="#e0f2fe" opacity="0.95" />
    </linearGradient>

    <radialGradient id="spotlightOrange" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#fdba74" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="spotlightCyan" cx="85%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#67e8f9" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="spotlightPurple" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="lightGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(249, 115, 22, 0.06)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Layer -->
  <rect width="100%" height="100%" fill="url(#eduMeshGrad)" />
  <rect width="100%" height="100%" fill="url(#lightGrid)" />

  <!-- Ambient Glows -->
  <rect width="100%" height="100%" fill="url(#spotlightOrange)" />
  <rect width="100%" height="100%" fill="url(#spotlightCyan)" />
  <rect width="100%" height="100%" fill="url(#spotlightPurple)" />

  <!-- Geometric Tech Mesh & Node Lines -->
  <g stroke="rgba(249, 115, 22, 0.2)" stroke-width="1.5" fill="none">
    <circle cx="250" cy="200" r="140" stroke-dasharray="6 4" />
    <circle cx="250" cy="200" r="8" fill="#f97316" />

    <circle cx="1650" cy="450" r="280" stroke="rgba(6, 182, 212, 0.25)" stroke-width="2" />
    <circle cx="1650" cy="450" r="10" fill="#06b6d4" />

    <!-- Connecting Mesh Web -->
    <path d="M 250 200 L 750 350 L 1250 220 L 1650 450" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1.5" />
    <path d="M 350 780 L 850 650 L 1400 850" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1.5" />

    <!-- Intersecting Nodes -->
    <circle cx="750" cy="350" r="6" fill="#06b6d4" />
    <circle cx="1250" cy="220" r="6" fill="#8b5cf6" />
    <circle cx="850" cy="650" r="6" fill="#f97316" />
  </g>

  <!-- Science & Atomic Vector Diagrams -->
  <g stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.3" transform="translate(1400, 150)">
    <!-- Atomic Rings -->
    <ellipse cx="100" cy="100" rx="90" ry="35" transform="rotate(30 100 100)" />
    <ellipse cx="100" cy="100" rx="90" ry="35" transform="rotate(-30 100 100)" />
    <ellipse cx="100" cy="100" rx="90" ry="35" transform="rotate(90 100 100)" />
    <circle cx="100" cy="100" r="10" fill="#06b6d4" />
  </g>

  <!-- Floating Mathematical & Scientific Formulas Watermark -->
  <g font-family="serif" font-weight="bold" opacity="0.3">
    <text x="120" y="180" fill="#ea580c" font-size="80">∑</text>
    <text x="1720" y="320" fill="#0891b2" font-size="100">π</text>
    <text x="450" y="960" fill="#0d9488" font-size="90">∫</text>
    <text x="1050" y="920" fill="#c2410c" font-size="65" font-family="monospace">E = mc²</text>
    <text x="1350" y="280" fill="#4f46e5" font-size="85">∞</text>
    <text x="160" y="920" fill="#0891b2" font-size="60" font-family="monospace">Δx</text>
    <text x="920" y="160" fill="#7c3aed" font-size="55" font-family="monospace">Ψ(x,t)</text>
  </g>
</svg>
